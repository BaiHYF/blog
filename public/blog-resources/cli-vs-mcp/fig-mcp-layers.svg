<svg width="646" height="362" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-mcp-layers-title fig-mcp-layers-desc">
  <title id="fig-mcp-layers-title">MCP 的三层构成</title>
  <desc id="fig-mcp-layers-desc">MCP 可拆成协议层、运维标准、生态分发三层，价值分布不均匀，分发依赖第三方平台。</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="60" y="64" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MCP · LAYERED STRUCTURE</text>
  <text x="60" y="104" fill="#2d3142" font-size="28" font-family="'Geist', sans-serif" font-weight="600">MCP 的三层构成</text>
  <text x="60" y="132" fill="#7a8399" font-size="12" font-family="'Geist', sans-serif">价值分布不均匀：后两层才是产品方真正需要投入的地方。</text>

  <g>
    <rect x="60" y="180" width="640" height="100" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="72" y="196" width="120" height="20" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
    <text x="132" y="210" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">层 3 · 分发</text>
    <text x="84" y="236" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">生态分发</text>
    <text x="84" y="260" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">平台目录与客户端连接器，让用户更易发现并安装。来自第三方平台，不是协议保证。</text>

    <rect x="60" y="300" width="640" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="72" y="316" width="120" height="20" rx="2" fill="transparent" stroke="rgba(79,93,117,0.5)" stroke-width="0.8"/>
    <text x="132" y="330" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">层 2 · 运维</text>
    <text x="84" y="356" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">运维标准</text>
    <text x="84" y="380" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">统一约定连接、调用、错误处理与版本管理，省去为每个客户端单独适配。</text>

    <rect x="60" y="416" width="640" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="72" y="432" width="120" height="20" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
    <text x="132" y="446" fill="#eb6c36" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">层 1 · 协议</text>
    <text x="84" y="472" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">协议层</text>
    <text x="84" y="496" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">把“调用工具”标准化。易实现；Tool Use / Function Calling 早已存在，非 MCP 发明。</text>
  </g>

  <g>
    <line x1="720" y1="180" x2="720" y2="512" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="748" y="224" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace">实现难度：低</text>
    <text x="748" y="340" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">价值：中高</text>
    <text x="748" y="456" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace">价值：高但依赖平台</text>
    <line x1="748" y1="244" x2="748" y2="340" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <line x1="748" y1="360" x2="748" y2="456" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  </g>
</svg>
