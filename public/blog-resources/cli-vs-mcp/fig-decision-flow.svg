<svg width="646" height="452" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-decision-flow-title fig-decision-flow-desc">
  <title id="fig-decision-flow-title">选型决策顺序</title>
  <desc id="fig-decision-flow-desc">先判断目标 Agent 能否跑 shell，再判断是否有成熟官方 CLI，然后考虑复用、身份、成本与产品治理，最后决定承接方式。</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="60" y="60" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.18em">DECISION ORDER · SELECTION</text>
  <text x="60" y="100" fill="#2d3142" font-size="28" font-family="'Geist', sans-serif" font-weight="600">选型决策顺序</text>

  <g>
    <rect x="60" y="140" width="360" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="240" y="172" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">目标 Agent 能跑 shell？</text>
    <text x="240" y="194" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">① 硬前提</text>
  </g>
  <line x1="240" y1="212" x2="240" y2="248" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <g>
    <rect x="60" y="252" width="360" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="240" y="284" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">有成熟官方 CLI 且模型熟悉？</text>
    <text x="240" y="306" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">② 传统 CLI 先验</text>
  </g>
  <line x1="240" y1="324" x2="240" y2="360" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <g>
    <rect x="60" y="364" width="360" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="240" y="396" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">三个追问：</text>
    <text x="240" y="420" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">跨客户端复用？代表谁？token 敏感？</text>
    <text x="240" y="440" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">③ 场景考量</text>
  </g>

  <g>
    <rect x="560" y="252" width="380" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
    <text x="750" y="284" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif" text-anchor="middle">不能跑 shell：网页端 / 嵌入式 / 沙箱</text>
    <text x="750" y="306" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">CLI 出局，走 MCP 等</text>
  </g>
  <line x1="420" y1="176" x2="560" y2="280" stroke="#4f5d75" stroke-width="1"/>
  <text x="470" y="212" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace">否</text>

  <g>
    <rect x="560" y="140" width="380" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
    <text x="750" y="172" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">是 → CLI 是候选</text>
    <text x="750" y="194" fill="#7a8399" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle">回到②判断先验</text>
  </g>

  <g>
    <rect x="60" y="520" width="880" height="120" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1"/>
    <text x="90" y="552" fill="#eb6c36" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="0.08em">④ 产品面（决定开放多少，而非选哪个）</text>
    <text x="90" y="584" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">鉴权 / 权限 / 审计 / 写操作确认是否就绪</text>
    <text x="90" y="612" fill="#4f5d75" font-size="12" font-family="'Geist', sans-serif">业务面宽窄决定长尾操作放 CLI 还是 MCP；治理未就绪时不急于暴露核心写入。</text>
  </g>
  <line x1="240" y1="452" x2="240" y2="520" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
</svg>
